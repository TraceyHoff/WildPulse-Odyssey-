<!DOCTYPE html>
<html>
<body>
<canvas id="c" width="100" height="100"></canvas>
<script>
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');

    // Fill red
    ctx.fillStyle = 'red';
    ctx.fillRect(0, 0, 100, 100);

    const depth = 12;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)'; // Top highlight
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(100, 0); ctx.lineTo(100 - depth, depth); ctx.lineTo(depth, depth);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = 'rgba(255, 255, 255, 0.1)'; // Left highlight
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(depth, depth); ctx.lineTo(depth, 100 - depth); ctx.lineTo(0, 100);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = 'rgba(0, 0, 0, 0.4)'; // Right shadow
    ctx.beginPath();
    ctx.moveTo(100, 0); ctx.lineTo(100, 100); ctx.lineTo(100 - depth, 100 - depth); ctx.lineTo(100 - depth, depth);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)'; // Bottom shadow
    ctx.beginPath();
    ctx.moveTo(0, 100); ctx.lineTo(depth, 100 - depth); ctx.lineTo(100 - depth, 100 - depth); ctx.lineTo(100, 100);
    ctx.closePath(); ctx.fill();
</script>
</body>
</html>
