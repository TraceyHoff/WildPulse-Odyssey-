<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
</head>
<body>
    <script>
        const config = {
            type: Phaser.WEBGL,
            width: 800,
            height: 600,
            scene: {
                preload: function () {

                },
                create: function () {
                    this.add.rectangle(400, 300, 800, 600, 0x00ff00);

                    const rt = this.add.renderTexture(0, 0, 800, 600);
                    rt.fill(0x000000, 0.8);

                    const light = this.add.circle(400, 300, 100, 0xffffff, 1);
                    light.setVisible(false);

                    // ERASE blend mode
                    rt.draw(light, 400, 300, null, null, null, null, null, Phaser.BlendModes.ERASE);
                }
            }
        };
        const game = new Phaser.Game(config);
    </script>
</body>
</html>
