<!DOCTYPE html>
<html>
<head>
    <title>Phaser Test</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.js"></script>
</head>
<body>
    <script>
        class TestScene extends Phaser.Scene {
            constructor() {
                super('TestScene');
            }
            create() {
                this.rt = this.add.renderTexture(0, 0, 800, 600);

                // Add a small rectangle texture to use for erase
                const g = this.add.graphics();
                g.fillStyle(0xffffff, 1);
                g.fillRect(0, 0, 50, 50);
                g.generateTexture('mask', 50, 50);
                g.destroy();

                this.time.addEvent({
                    delay: 16,
                    loop: true,
                    callback: () => {
                        this.rt.clear();
                        this.rt.fill(0x000000, 1);
                        this.rt.erase('mask', 100, 100);
                    }
                });
            }
        }

        const config = {
            type: Phaser.WEBGL,
            width: 800,
            height: 600,
            scene: TestScene
        };
        const game = new Phaser.Game(config);
    </script>
</body>
</html>
