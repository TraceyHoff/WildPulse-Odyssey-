<!DOCTYPE html>
<html>
<head>
<style>
@keyframes eggHatchGlow {
    0% { box-shadow: 0 0 5px #00ffcc; }
    50% { box-shadow: 0 0 20px #00ffcc; }
    100% { box-shadow: 0 0 5px #00ffcc; }
}
.egg-hatch-glow {
    animation: eggHatchGlow 1.5s infinite alternate;
}
</style>
</head>
<body style="background: #111; padding: 50px;">
    <div style="display: flex; gap: 20px;">
        <!-- Not ready -->
        <div class="egg-slot" style="width: 60px; height: 60px; border-radius: 8px; position: relative; background: conic-gradient(#00ffcc 75%, #555 75%); padding: 2px; cursor: pointer;">
            <div style="width: 100%; height: 100%; background: rgba(10, 15, 30, 0.9); border-radius: 6px; display: flex; align-items: center; justify-content: center; position: relative;">
                🥚
            </div>
        </div>

        <!-- Ready -->
        <div class="egg-slot egg-hatch-glow" style="width: 60px; height: 60px; border-radius: 8px; position: relative; background: conic-gradient(#00ffcc 100%, #555 100%); padding: 2px; cursor: pointer;">
            <div style="width: 100%; height: 100%; background: rgba(10, 15, 30, 0.9); border-radius: 6px; display: flex; align-items: center; justify-content: center; position: relative;">
                🥚
            </div>
        </div>
    </div>
</body>
</html>
